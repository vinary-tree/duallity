name: Checkout development siblings
description: >
  Recreate the Vinary Tree sibling source graph for Cargo path dependencies
inputs:
  ref:
    description: >
      Baseline development ref. A release/* pull-request head selects the same
      coordinated branch for every non-llattice sibling unless explicitly
      overridden.
    required: false
    default: master
  coordinated-ref:
    description: >
      Optional feature branch selected for each sibling where that exact
      remote branch exists. Repositories without it use their configured
      fallback. Release workflows do not set this input.
    required: false
    default: ""
  llattice-ref:
    description: llattice Git ref
    required: false
    default: v0.1.0
  libdictenstein-ref:
    description: libdictenstein Git ref
    required: false
    default: ""
  liblevenshtein-ref:
    description: liblevenshtein-rust Git ref
    required: false
    default: ""
  lling-llang-ref:
    description: lling-llang Git ref
    required: false
    default: ""
  interop-ref:
    description: vinary-tree-interop Git ref
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Clone the complete sibling graph
      shell: bash
      env:
        BASELINE_REF: ${{ inputs.ref }}
        COORDINATED_REF: ${{ inputs.coordinated-ref }}
        LLATTICE_REF: ${{ inputs.llattice-ref }}
        LIBDICTENSTEIN_REF: ${{ inputs.libdictenstein-ref }}
        LIBLEVENSHTEIN_REF: ${{ inputs.liblevenshtein-ref }}
        LLING_LLANG_REF: ${{ inputs.lling-llang-ref }}
        INTEROP_REF: ${{ inputs.interop-ref }}
      run: |
        set -euo pipefail
        parent="$(dirname "$GITHUB_WORKSPACE")"
        event_ref="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME:-}}"
        if [[ "$event_ref" == release/* ]]; then
          development_ref="$event_ref"
        else
          development_ref="$BASELINE_REF"
        fi
        git check-ref-format --branch "$development_ref" >/dev/null
        clone() {
          local repository="$1"
          local ref="$2"
          if [[ -z "$ref" ]]; then
            ref="$development_ref"
          fi
          if [[ -n "$COORDINATED_REF" ]] &&
             git ls-remote --exit-code --heads \
               "https://github.com/vinary-tree/$repository.git" \
               "$COORDINATED_REF" >/dev/null 2>&1; then
            ref="$COORDINATED_REF"
          fi
          git check-ref-format --branch "$ref" >/dev/null
          echo "::group::Cloning $repository @ $ref"
          git clone --depth 1 --branch "$ref" \
            "https://github.com/vinary-tree/$repository.git" \
            "$parent/$repository"
          echo "::endgroup::"
        }
        clone vinary-tree-interop "$INTEROP_REF"
        clone llattice "$LLATTICE_REF"
        clone libdictenstein "$LIBDICTENSTEIN_REF"
        clone liblevenshtein-rust "$LIBLEVENSHTEIN_REF"
        clone lling-llang "$LLING_LLANG_REF"
