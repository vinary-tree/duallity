name: CI

# Added 2026-07. This repository previously had no CI at all, so a dependency
# advisory, a formatting drift or a broken build could only be found by someone
# running the commands locally.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
  schedule:
    # Weekly, so the supply-chain job re-checks advisories against code that has
    # not changed. Advisories are published, not introduced by commits.
    - cron: "23 4 * * 1"

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/checkout-dev-siblings
        with:
          coordinated-ref: ${{ github.head_ref || github.ref_name }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Binding-surface drift gate
        run: python3 scripts/check-bindings.py
      - name: Binding-documentation gate
        run: python3 scripts/check-binding-docs.py
      - name: cargo build
        run: cargo build --verbose
      - name: cargo test
        run: cargo test --all-features --no-fail-fast
      - name: cargo fmt --check
        run: cargo fmt --all -- --check

  julia:
    name: Julia ${{ matrix.julia-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        julia-version: ['1.10', '1.12']
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/checkout-dev-siblings
        with:
          coordinated-ref: ${{ github.head_ref || github.ref_name }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}
      - name: Build native binding library
        run: cargo build --no-default-features --features julia-bindings
      - name: Instantiate and test the Julia family graph
        env:
          JULIA_DEPOT_PATH: ${{ github.workspace }}/target/julia-depot
          DUALLITY_LIBRARY: ${{ github.workspace }}/target/debug/libduallity.so
        run: |
          cargo build --manifest-path ../libdictenstein/Cargo.toml \
            --no-default-features --features julia-bindings
          cargo build --manifest-path ../lling-llang/Cargo.toml \
            --no-default-features --features julia-bindings
          family_root="$(dirname "$GITHUB_WORKSPACE")"
          libdict="$family_root/libdictenstein/target/debug/liblibdictenstein.so"
          llinglang="$family_root/lling-llang/target/debug/liblling_llang.so"
          LIBDICTENSTEIN_LIBRARY="$libdict" LLING_LLANG_LIBRARY="$llinglang" \
            julia --project=bindings/julia/Duallity -e '
            using Pkg
            Pkg.develop([
              Pkg.PackageSpec(path="../vinary-tree-interop/bindings/julia/VinaryTreeInterop"),
              Pkg.PackageSpec(path="../libdictenstein/bindings/julia/Libdictenstein"),
              Pkg.PackageSpec(path="../lling-llang/bindings/julia/LlingLlang"),
            ])
            Pkg.test()
          '
      - name: Build strict Julia API documentation
        env:
          JULIA_DEPOT_PATH: ${{ github.workspace }}/target/julia-depot
          DUALLITY_LIBRARY: ${{ github.workspace }}/target/debug/libduallity.so
          DUALLITY_DOCS_BUILD: ${{ github.workspace }}/target/julia-docs
        run: |
          julia --project=bindings/julia/Duallity/docs -e '
            using Pkg
            Pkg.develop([
              Pkg.PackageSpec(path="../vinary-tree-interop/bindings/julia/VinaryTreeInterop"),
              Pkg.PackageSpec(path="bindings/julia/Duallity"),
            ])
            Pkg.instantiate()
          '
          julia --project=bindings/julia/Duallity/docs \
            bindings/julia/Duallity/docs/make.jl

  raku:
    name: Raku NativeCall family composition
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/checkout-dev-siblings
        with:
          coordinated-ref: ${{ github.head_ref || github.ref_name }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Rakudo
        run: sudo apt-get update && sudo apt-get install -y rakudo
      - name: Build native family libraries
        run: |
          cargo build --no-default-features --features raku-bindings
          cargo build --manifest-path ../libdictenstein/Cargo.toml \
            --no-default-features --features raku-bindings
          cargo build --manifest-path ../lling-llang/Cargo.toml \
            --no-default-features --features raku-bindings
      - name: Test Raku adapter and composition
        env:
          DUALLITY_LIBRARY: ${{ github.workspace }}/target/debug/libduallity.so
        run: |
          family_root="$(dirname "$GITHUB_WORKSPACE")"
          libdict="$family_root/libdictenstein/target/debug/liblibdictenstein.so"
          llinglang="$family_root/lling-llang/target/debug/liblling_llang.so"
          RAKULIB="$GITHUB_WORKSPACE/bindings/raku/lib,\
          $GITHUB_WORKSPACE/../vinary-tree-interop/bindings/raku/lib,\
          $GITHUB_WORKSPACE/../libdictenstein/bindings/raku/lib,\
          $GITHUB_WORKSPACE/../lling-llang/bindings/raku/lib" \
          LIBDICTENSTEIN_LIBRARY="$libdict" \
          LLING_LLANG_LIBRARY="$llinglang" \
            raku bindings/raku/t/01-conformance.rakutest
      - name: Render packaged Pod
        run: |
          RAKULIB="$GITHUB_WORKSPACE/bindings/raku/lib,\
          $GITHUB_WORKSPACE/../vinary-tree-interop/bindings/raku/lib" \
            raku --doc=Text bindings/raku/doc/Duallity.rakudoc \
            > target/Duallity.txt

  # ---------------------------------------------------------------------
  # Multi-cdylib C family pipeline: build all four sibling crates as
  # separate shared libraries (each with only its own `ffi` feature, so the
  # exported C ABIs are disjoint) and run bindings/c/tests/family_pipeline.c
  # against all four in one process. This is the C-ABI counterpart of the
  # in-process Rust test tests/family_pipeline.rs and exercises the whole
  # producer -> adapter -> composer / consumer chain end to end.
  # ---------------------------------------------------------------------
  c-family-pipeline:
    name: C family pipeline (four cdylibs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/checkout-dev-siblings
        with:
          coordinated-ref: ${{ github.head_ref || github.ref_name }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Build four cdylibs, compile and run the C family pipeline
        run: bindings/c/tests/build-and-run.sh

  # ---------------------------------------------------------------------
  # Dynamic analysis: AddressSanitizer (+ LeakSanitizer) then ThreadSanitizer
  # over duallity's OWN Rust FFI/ABI boundary tests (--features ffi). Catches,
  # at the C ABI gate, the defect classes safe Rust and catch_unwind cannot:
  # use-after-free, out-of-bounds access, leaked leased/retained VtResource
  # handles, and data races across the call gate. The multi-cdylib C
  # family_pipeline job above is already valgrind-covered; this leg covers the
  # Rust FFI surface under the sanitizer runtimes instead. Requires nightly +
  # rust-src for -Zbuild-std, which rebuilds std (and, because duallity is a
  # path-dep consumer of all three siblings, the sibling stack) with the
  # sanitizer runtime, so it is deliberately its own slow job.
  # ---------------------------------------------------------------------
  sanitizers:
    name: Sanitizers (ASan/TSan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/checkout-dev-siblings
        with:
          coordinated-ref: ${{ github.head_ref || github.ref_name }}
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - name: AddressSanitizer and ThreadSanitizer over the FFI boundary suite
        run: bash scripts/run-sanitizers.sh

  # ---------------------------------------------------------------------
  # Supply-chain gate: published advisories, banned crates, permitted
  # sources. Configured in deny.toml.
  #
  # This job can fail on a commit that changes nothing, because advisories
  # are published against already-merged code. That is the point.
  # ---------------------------------------------------------------------
  supply-chain:
    name: Supply chain (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/checkout-dev-siblings
        with:
          coordinated-ref: ${{ github.head_ref || github.ref_name }}
      # Docker actions mount only this repository and therefore hide sibling
      # path dependencies. Run cargo-deny in the host runner namespace.
      - uses: taiki-e/install-action@cargo-deny
      - run: cargo deny check advisories bans sources licenses
