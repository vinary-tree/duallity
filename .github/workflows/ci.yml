name: CI

# Added 2026-07. This repository previously had no CI at all, so a dependency
# advisory, a formatting drift or a broken build could only be found by someone
# running the commands locally.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
  schedule:
    # Weekly, so the supply-chain job re-checks advisories against code that has
    # not changed. Advisories are published, not introduced by commits.
    - cron: "23 4 * * 1"

env:
  CARGO_TERM_COLOR: always
  # gxhash (via PathMap) requires AES-NI + SSE2 at compile time.
  RUSTFLAGS: "-C target-feature=+aes,+sse2"

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/checkout-dev-siblings
        with:
          lling-llang-ref: ${{ startsWith(github.ref_name, 'release/') && github.ref_name || 'master' }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Binding-surface drift gate
        run: python3 scripts/check-bindings.py
      - name: Binding-documentation gate
        run: python3 scripts/check-binding-docs.py
      - name: cargo build
        run: cargo build --verbose
      - name: cargo test
        run: cargo test --all-features --no-fail-fast
      - name: cargo fmt --check
        run: cargo fmt --all -- --check

  # ---------------------------------------------------------------------
  # Multi-cdylib C family pipeline: build all four sibling crates as
  # separate shared libraries (each with only its own `ffi` feature, so the
  # exported C ABIs are disjoint) and run bindings/c/tests/family_pipeline.c
  # against all four in one process. This is the C-ABI counterpart of the
  # in-process Rust test tests/family_pipeline.rs and exercises the whole
  # producer -> adapter -> composer / consumer chain end to end.
  # ---------------------------------------------------------------------
  c-family-pipeline:
    name: C family pipeline (four cdylibs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/checkout-dev-siblings
        with:
          lling-llang-ref: ${{ startsWith(github.ref_name, 'release/') && github.ref_name || 'master' }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Build four cdylibs, compile and run the C family pipeline
        run: bindings/c/tests/build-and-run.sh

  # ---------------------------------------------------------------------
  # Dynamic analysis: AddressSanitizer (+ LeakSanitizer) then ThreadSanitizer
  # over duallity's OWN Rust FFI/ABI boundary tests (--features ffi). Catches,
  # at the C ABI gate, the defect classes safe Rust and catch_unwind cannot:
  # use-after-free, out-of-bounds access, leaked leased/retained VtResource
  # handles, and data races across the call gate. The multi-cdylib C
  # family_pipeline job above is already valgrind-covered; this leg covers the
  # Rust FFI surface under the sanitizer runtimes instead. Requires nightly +
  # rust-src for -Zbuild-std, which rebuilds std (and, because duallity is a
  # path-dep consumer of all three siblings, the sibling stack) with the
  # sanitizer runtime, so it is deliberately its own slow job.
  # ---------------------------------------------------------------------
  sanitizers:
    name: Sanitizers (ASan/TSan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/checkout-dev-siblings
        with:
          lling-llang-ref: ${{ startsWith(github.ref_name, 'release/') && github.ref_name || 'master' }}
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - name: AddressSanitizer and ThreadSanitizer over the FFI boundary suite
        run: bash scripts/run-sanitizers.sh

  # ---------------------------------------------------------------------
  # Supply-chain gate: published advisories, banned crates, permitted
  # sources. Configured in deny.toml.
  #
  # This job can fail on a commit that changes nothing, because advisories
  # are published against already-merged code. That is the point.
  # ---------------------------------------------------------------------
  supply-chain:
    name: Supply chain (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/checkout-dev-siblings
        with:
          lling-llang-ref: ${{ startsWith(github.ref_name, 'release/') && github.ref_name || 'master' }}
      # Docker actions mount only this repository and therefore hide sibling
      # path dependencies. Run cargo-deny in the host runner namespace.
      - uses: taiki-e/install-action@cargo-deny
      - run: cargo deny check advisories bans sources licenses
