name: Publish Julia API documentation

on:
  push:
    branches: [master]
    paths:
      - .github/actions/checkout-dev-siblings/action.yml
      - .github/workflows/docs-julia.yml
      - bindings/api.json
      - bindings/julia/Duallity/**
      - include/duallity.h
      - src/bindings.rs
      - src/ffi.rs
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: duallity-julia-docs
  cancel-in-progress: true

jobs:
  documenter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/checkout-dev-siblings
      - uses: dtolnay/rust-toolchain@stable
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'
      - name: Build the documented native family
        run: |
          cargo build --no-default-features --features julia-bindings
          # Each sibling must load its own architecture-specific Cargo configuration.
          (cd ../libdictenstein && cargo build --no-default-features --features julia-bindings)
          (cd ../lling-llang && cargo build --no-default-features --features julia-bindings)
      - name: Instantiate local package dependencies
        env:
          JULIA_DEPOT_PATH: ${{ github.workspace }}/target/julia-depot
        run: |
          julia --project=bindings/julia/Duallity/docs -e '
            using Pkg
            Pkg.develop([
              Pkg.PackageSpec(path="../vinary-tree-interop/bindings/julia/VinaryTreeInterop"),
              Pkg.PackageSpec(path="../libdictenstein/bindings/julia/Libdictenstein"),
              Pkg.PackageSpec(path="../lling-llang/bindings/julia/LlingLlang"),
              Pkg.PackageSpec(path="bindings/julia/Duallity"),
            ])
            Pkg.instantiate()
          '
      - name: Build and deploy strict API documentation
        env:
          DUALLITY_LIBRARY: ${{ github.workspace }}/target/debug/libduallity.so
          LIBDICTENSTEIN_LIBRARY: ${{ github.workspace }}/../libdictenstein/target/debug/liblibdictenstein.so
          LLING_LLANG_LIBRARY: ${{ github.workspace }}/../lling-llang/target/debug/liblling_llang.so
          DUALLITY_DOCS_DEPLOY: '1'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JULIA_DEPOT_PATH: ${{ github.workspace }}/target/julia-depot
        run: >-
          julia --project=bindings/julia/Duallity/docs
          bindings/julia/Duallity/docs/make.jl
      - name: Read back the deployed dev documentation
        run: |
          git fetch --depth 1 origin gh-pages
          git cat-file -e FETCH_HEAD:dev/index.html
          git show FETCH_HEAD:dev/index.html |
            grep -Fq 'A captured fuzzy query and its composition'
