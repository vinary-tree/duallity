[package]
name = "duallity"
version = "4.0.0-rc.6"
edition = "2021"
# Matches the libdictenstein / liblevenshtein / lling-llang path dependencies,
# whose --all-features floor is set by sysinfo 0.39 (1.95).
rust-version = "1.95"
authors = ["Dylon Edwards <dylon.devo@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/vinary-tree/duallity"
description = "Turn fuzzy dictionary queries into lazy weighted transducers that compose with phonetic rewrites, grammars, language models, and custom lling-llang pipelines."
keywords = ["wfst", "levenshtein", "transducer", "fuzzy", "composition"]
categories = ["text-processing", "algorithms"]
readme = "README.md"

[dependencies]
liblevenshtein = { path = "../liblevenshtein-rust", version = "=4.0.0-rc.6" }
lling-llang = { path = "../lling-llang", version = "=4.0.0-rc.6", default-features = false }
libdictenstein = { path = "../libdictenstein", version = "=4.0.0-rc.6" }
vinary-tree-interop = { path = "../vinary-tree-interop", version = "=4.0.0-rc.6", optional = true }
# Direct deps used by the relocated wfst sources
# 2.x changed the hash algorithm, so digests differ from 1.x. Safe here: every
# use is an in-memory index, nothing is persisted.
rustc-hash = "2.1"
smallvec = "1.13"
# Pulled by the original liblevenshtein `wfst` feature (sampling / universal automata)
# 0.9.3 is the fix floor for RUSTSEC-2026-0097 (unsound with a custom logger
# using `rand::rng()`).
rand = "0.9.3"

[features]
default = []
bindings-core = [
    "dep:vinary-tree-interop",
    "lling-llang/bindings-core",
    "liblevenshtein/bindings-core",
]
ffi = ["bindings-core"]
native-bindings-full = ["ffi", "phonetic-rules"]
c-bindings = ["native-bindings-full"]
cpp-bindings = ["native-bindings-full"]
python-bindings = ["native-bindings-full"]
jvm-bindings = ["native-bindings-full"]
clojure-bindings = ["jvm-bindings"]
javascript-bindings = ["bindings-core"]
typescript-bindings = ["javascript-bindings"]
clojurescript-bindings = ["javascript-bindings"]
dotnet-bindings = ["native-bindings-full"]
go-bindings = ["native-bindings-full"]
swift-bindings = ["native-bindings-full"]
ruby-bindings = ["native-bindings-full"]
fortran-bindings = ["native-bindings-full"]
ocaml-bindings = ["native-bindings-full"]
haskell-bindings = ["native-bindings-full"]
lua-bindings = ["native-bindings-full"]
julia-bindings = ["native-bindings-full"]
raku-bindings = ["native-bindings-full"]
# Phonetic Levenshtein WFST variants (require liblevenshtein's phonetic rules)
phonetic-rules = ["liblevenshtein/phonetic-rules"]

[dev-dependencies]
criterion = "0.8"
proptest = "1.11"
libdictenstein = { path = "../libdictenstein", version = "=4.0.0-rc.6", features = ["bindings-core"] }

[[bench]]
name = "wfst_expansion"
harness = false

[[bench]]
name = "fzf_trie_vs_flat"
harness = false

[[bench]]
name = "ffi_constructor_benchmarks"
harness = false
required-features = ["ffi"]

[package.metadata.docs.rs]
all-features = true

[lib]
crate-type = ["rlib", "cdylib", "staticlib"]

# Keep this standalone repository from being captured by an unrelated parent
# workspace when it is checked out beneath another Rust project for validation.
[workspace]
