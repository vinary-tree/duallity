[build-system]
requires = [
  "setuptools==84.0.0",
  "wheel==0.48.0",
  "tomli==2.4.1; python_version < '3.11'",
]
build-backend = "setuptools.build_meta"

[project]
name = "duallity"
version = "4.0.0rc6"
description = "Turn fuzzy dictionary queries into lazy weighted transducers that compose with phonetic rewrites, grammars, language models, and custom lling-llang pipelines."
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Dylon Edwards", email = "dylon.devo@gmail.com" }]
keywords = ["fuzzy-search", "wfst", "levenshtein", "phonetics", "language-model"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Rust",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries",
  "Topic :: Text Processing :: Linguistic",
]
dependencies = ["vinary-tree-interop==4.0.0rc6"]

[project.optional-dependencies]
test = [
  "libdictenstein==4.0.0rc6",
  "lling-llang==4.0.0rc6",
]

[dependency-groups]
documentation = ["pdoc==16.0.0"]

[tool.uv.sources]
vinary-tree-interop = { path = "../../../vinary-tree-interop/bindings/python" }
libdictenstein = { path = "../../../libdictenstein/bindings/python" }
lling-llang = { path = "../../../lling-llang/bindings/python" }

[project.urls]
Homepage = "https://github.com/vinary-tree/duallity"
Repository = "https://github.com/vinary-tree/duallity"
Documentation = "https://github.com/vinary-tree/duallity/tree/v4.0.0-rc.6/bindings/python"
Issues = "https://github.com/vinary-tree/duallity/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
duallity = ["LICENSE", "py.typed", "native/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
