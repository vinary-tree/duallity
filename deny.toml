# cargo-deny configuration for duallity.
#
# Added 2026-07 as part of a fleet-wide supply-chain sweep. This tree was the
# cleanest in the fleet -- a single advisory (crossbeam-epoch, RUSTSEC-2026-0204)
# reached only transitively through rayon -- but nothing was checking, so that was
# luck rather than hygiene.
#
#     cargo deny check
#
# Mirrors the configuration in libdictenstein, liblevenshtein and lling-llang.

[graph]
all-features = true

[advisories]
yanked = "deny"

# Every entry MUST carry a reason and a REVIEW-BY date.
ignore = [
  { id = "RUSTSEC-2025-0141", reason = "REVIEW-BY 2026-10-31. bincode unmaintained, no fixed version (3.0.0 is a tombstone containing only a compiler error). Reached only transitively via libdictenstein / liblevenshtein / lling-llang, each of which pins it `>=2.0, <3`. Fleet-wide migration to bincode-next is planned." },
]

[licenses]
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "BSL-1.0",
  "MPL-2.0",
  "CC0-1.0",
  "Unlicense",
]
confidence-threshold = 0.9
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
# "warn": this crate depends on sibling repositories by path, which carry no
# version requirement by construction. Registry wildcards are the real risk.
wildcards = "warn"

deny = [
  { crate = "bincode:>=3.0.0", reason = "bincode 3.0.0 is a deliberate tombstone release and does not compile" },
  { crate = "paste", reason = "unmaintained (RUSTSEC-2024-0436); use `pastey`" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
