<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="764px" preserveAspectRatio="none" style="width:743px;height:764px;background:#FFFFFF;" version="1.1" viewBox="0 0 743 764" width="743px" zoomAndPan="magnify"><?plantuml $version$?><defs/><g><g class="title" data-source-line="6"><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="496.9795" x="122.092" y="32.9951">Generalized expansion: complete publication or explicit failure</text></g><ellipse cx="447.62" cy="62.2969" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><rect fill="#D6EAF8" height="47.9375" rx="12.5" ry="12.5" style="stroke:#34495E;stroke-width:0.5;" width="201.8047" x="346.7177" y="92.2969"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="12" lengthAdjust="spacing" textLength="181.8047" x="356.7177" y="113.4355">Open computation fault scope</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="12" lengthAdjust="spacing" textLength="137.8828" x="356.7177" y="127.4043">and check cancellation</text><rect fill="#D1F2EB" height="47.9375" rx="12.5" ry="12.5" style="stroke:#34495E;stroke-width:0.5;" width="233.1582" x="331.0409" y="160.2344"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="12" lengthAdjust="spacing" textLength="213.1582" x="341.0409" y="181.373">Resolve immutable dictionary node</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="12" lengthAdjust="spacing" textLength="170.1855" x="341.0409" y="195.3418">and determine exact finality</text><rect fill="#D6EAF8" height="61.9063" rx="12.5" ry="12.5" style="stroke:#34495E;stroke-width:0.5;" width="259.3203" x="317.9598" y="228.1719"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="12" lengthAdjust="spacing" textLength="171.5684" x="327.9598" y="249.3105">Build metered width caches;</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="12" lengthAdjust="spacing" textLength="239.3203" x="327.9598" y="263.2793">iterative DFS and staged operation arcs</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="12" lengthAdjust="spacing" textLength="137.543" x="327.9598" y="277.248">(no shared write locks)</text><polygon fill="#F1F1F1" points="334.9532,310.0781,560.2867,310.0781,572.2867,322.0781,560.2867,334.0781,334.9532,334.0781,322.9532,322.0781,334.9532,310.0781" style="stroke:#34495E;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="11" lengthAdjust="spacing" textLength="225.3335" x="334.9532" y="325.8862">Traversal, source and work checks pass?</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="11" lengthAdjust="spacing" textLength="19.0083" x="303.9449" y="319.4839">yes</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="11" lengthAdjust="spacing" textLength="13.7017" x="572.2867" y="319.4839">no</text><rect fill="#EAECEE" height="61.9063" rx="12.5" ry="12.5" style="stroke:#34495E;stroke-width:0.5;" width="305.9199" x="116.9368" y="344.0781"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="12" lengthAdjust="spacing" textLength="285.9199" x="126.9368" y="365.2168">Reconcile dictionary identities under node lock;</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="12" lengthAdjust="spacing" textLength="242.8184" x="126.9368" y="379.1855">retire duplicate owners outside the lock;</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="12" lengthAdjust="spacing" textLength="276.9023" x="126.9368" y="393.1543">retry with checks and a bounded work budget</text><rect fill="#D6EAF8" height="47.9375" rx="12.5" ry="12.5" style="stroke:#34495E;stroke-width:0.5;" width="283.5078" x="128.1428" y="425.9844"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="12" lengthAdjust="spacing" textLength="263.4902" x="138.1428" y="447.123">Keep the stable node lock, then lock states;</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="12" lengthAdjust="spacing" textLength="263.5078" x="138.1428" y="461.0918">reserve complete products and label chains</text><polygon fill="#F1F1F1" points="162.0908,493.9219,377.7026,493.9219,389.7026,506.7266,377.7026,519.5313,162.0908,519.5313,150.0908,506.7266,162.0908,493.9219" style="stroke:#34495E;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="11" lengthAdjust="spacing" textLength="155.7886" x="162.0908" y="504.1323">Retained limits, reservation,</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="11" lengthAdjust="spacing" textLength="215.6118" x="162.0908" y="516.937">cancellation and own fault scope pass?</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="11" lengthAdjust="spacing" textLength="19.0083" x="131.0825" y="504.1323">yes</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="11" lengthAdjust="spacing" textLength="13.7017" x="389.7026" y="504.1323">no</text><rect fill="#D5F5E3" height="33.9688" rx="12.5" ry="12.5" style="stroke:#34495E;stroke-width:0.5;" width="198.9395" x="40.6211" y="529.5313"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="12" lengthAdjust="spacing" textLength="178.9395" x="50.6211" y="550.6699">Publish all prepared identities</text><rect fill="#EAECEE" height="33.9688" rx="12.5" ry="12.5" style="stroke:#34495E;stroke-width:0.5;" width="132.7988" x="73.6914" y="583.5"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="12" lengthAdjust="spacing" textLength="112.7988" x="83.6914" y="604.6387">Release both locks</text><rect fill="#E8DAEF" height="47.9375" rx="12.5" ry="12.5" style="stroke:#34495E;stroke-width:0.5;" width="248.1816" x="16" y="652.4688"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="12" lengthAdjust="spacing" textLength="205.3301" x="26" y="673.6074">Release staging reference counts;</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="12" lengthAdjust="spacing" textLength="228.1816" x="26" y="687.5762">return and cache complete expansion</text><ellipse cx="140.0908" cy="733.4063" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="140.0908" cy="733.4063" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><rect fill="#EAECEE" height="33.9688" rx="12.5" ry="12.5" style="stroke:#34495E;stroke-width:0.5;" width="132.7988" x="333.3032" y="529.5313"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="12" lengthAdjust="spacing" textLength="112.7988" x="343.3032" y="550.6699">Release both locks</text><rect fill="#FADBD8" height="61.9063" rx="12.5" ry="12.5" style="stroke:#34495E;stroke-width:0.5;" width="195.6406" x="301.8823" y="583.5"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="12" lengthAdjust="spacing" textLength="113.25" x="311.8823" y="604.6387">Drop local staging;</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="12" lengthAdjust="spacing" textLength="175.6406" x="311.8823" y="618.6074">return failure or cancellation;</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="12" lengthAdjust="spacing" textLength="166.6348" x="311.8823" y="632.5762">publish no identities or arcs</text><ellipse cx="399.7026" cy="691.4063" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="399.7026" cy="691.4063" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><rect fill="#FADBD8" height="61.9063" rx="12.5" ry="12.5" style="stroke:#34495E;stroke-width:0.5;" width="195.6406" x="527.5229" y="344.0781"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="12" lengthAdjust="spacing" textLength="113.25" x="537.5229" y="365.2168">Drop local staging;</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="12" lengthAdjust="spacing" textLength="175.6406" x="537.5229" y="379.1855">return failure or cancellation;</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="12" lengthAdjust="spacing" textLength="166.6348" x="537.5229" y="393.1543">publish no identities or arcs</text><ellipse cx="625.3433" cy="436.9844" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="625.3433" cy="436.9844" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><line style="stroke:#34495E;stroke-width:1;" x1="447.62" x2="447.62" y1="72.2969" y2="92.2969"/><polygon fill="#34495E" points="443.62,82.2969,447.62,92.2969,451.62,82.2969,447.62,86.2969" style="stroke:#34495E;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#34495E;stroke-width:1;" x1="447.62" x2="447.62" y1="140.2344" y2="160.2344"/><polygon fill="#34495E" points="443.62,150.2344,447.62,160.2344,451.62,150.2344,447.62,154.2344" style="stroke:#34495E;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#34495E;stroke-width:1;" x1="447.62" x2="447.62" y1="208.1719" y2="228.1719"/><polygon fill="#34495E" points="443.62,218.1719,447.62,228.1719,451.62,218.1719,447.62,222.1719" style="stroke:#34495E;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#34495E;stroke-width:1;" x1="269.8967" x2="269.8967" y1="405.9844" y2="425.9844"/><polygon fill="#34495E" points="265.8967,415.9844,269.8967,425.9844,273.8967,415.9844,269.8967,419.9844" style="stroke:#34495E;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#34495E;stroke-width:1;" x1="140.0908" x2="140.0908" y1="563.5" y2="583.5"/><polygon fill="#34495E" points="136.0908,573.5,140.0908,583.5,144.0908,573.5,140.0908,577.5" style="stroke:#34495E;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#34495E;stroke-width:1;" x1="140.0908" x2="140.0908" y1="617.4688" y2="652.4688"/><polygon fill="#34495E" points="136.0908,642.4688,140.0908,652.