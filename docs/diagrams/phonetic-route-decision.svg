<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="321px" preserveAspectRatio="none" style="width:1348px;height:321px;background:#FFFFFF;" version="1.1" viewBox="0 0 1348 321" width="1348px" zoomAndPan="magnify"><?plantuml $version$?><defs/><g><g class="title" data-source-line="13"><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="383.5713" x="481.4087" y="32.9951">Phonetic matching &#8212; rules route vs. regex route</text></g><ellipse cx="521.3464" cy="62.2969" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><rect fill="#EAECEE" height="33.9688" rx="12.5" ry="12.5" style="stroke:#34495E;stroke-width:0.5;" width="212.9082" x="414.8923" y="92.2969"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="12" lengthAdjust="spacing" textLength="192.9082" x="424.8923" y="113.4355">Phonetic / sound-alike matching</text><polygon fill="#EAECEE" points="403.7463,146.2656,638.9465,146.2656,650.9465,158.2656,638.9465,170.2656,403.7463,170.2656,391.7463,158.2656,403.7463,146.2656" style="stroke:#34495E;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#2C3E50" font-family="'DejaVu Sans'" font-size="11" lengthAdjust="spacing" textLength="235.2002" x="403.7463" y="162.0737">How is the sound-alike mapping specified?</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="11" lengthAdjust="spacing" textLength="100.1763" x="291.5701" y="155.6714">fixed rewrite rules</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="11" lengthAdjust="spacing" textLength="137.2314" x="650.9465" y="155.6714">a phonetic regex pattern</text><path d="M392.2402,180.2656 L392.2402,211.5313 L372.2402,215.5313 L392.2402,219.5313 L392.2402,250.7969 A0,0 0 0 0 392.2402,250.7969 L695.8188,250.7969 A0,0 0 0 0 695.8188,250.7969 L695.8188,190.2656 L685.8188,180.2656 L392.2402,180.2656 A0,0 0 0 0 392.2402,180.2656" fill="#D1F2EB" style="stroke:#181818;stroke-width:0.5;"/><path d="M685.8188,180.2656 L685.8188,190.2656 L695.8188,190.2656 L685.8188,180.2656" fill="#D1F2EB" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="249.0059" x="398.2402" y="197.3325">Use when: a small set of deterministic</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="238.6973" x="398.2402" y="212.4653">substitutions (ph-&gt;f, ck-&gt;k) suffices.</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="243.9849" x="398.2402" y="227.5981">Zero build config; composes with any</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="282.5786" x="398.2402" y="242.731">LevenshteinWfst via compose(rewrite, lev).</text><rect fill="#D6EAF8" height="61.9063" rx="12.5" ry="12.5" style="stroke:#34495E;stroke-width:0.5;" width="356.2402" x="16" y="184.5781"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="12" font-weight="700" lengthAdjust="spacing" textLength="83.707" x="26" y="205.7168">RewriteWfst</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="12" lengthAdjust="spacing" textLength="10.0547" x="26" y="219.6855">+</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="12" font-weight="700" lengthAdjust="spacing" textLength="155.25" x="39.8691" y="219.6855">CommonPhoneticRules</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="12" lengthAdjust="spacing" textLength="163.3066" x="198.9336" y="219.6855">:: english / german / french</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="12" lengthAdjust="spacing" textLength="212.0391" x="26" y="233.6543">no feature gate &#8212; always available</text><ellipse cx="194.1201" cy="290.4219" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="194.1201" cy="290.4219" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><path d="M1001.3267,183.5195 L1001.3267,207.2188 L981.3267,211.2188 L1001.3267,215.2188 L1001.3267,238.918 A0,0 0 0 0 1001.3267,238.918 L1327.3887,238.918 A0,0 0 0 0 1327.3887,238.918 L1327.3887,193.5195 L1317.3887,183.5195 L1001.3267,183.5195 A0,0 0 0 0 1001.3267,183.5195" fill="#D1F2EB" style="stroke:#181818;stroke-width:0.5;"/><path d="M1317.3887,183.5195 L1317.3887,193.5195 L1327.3887,193.5195 L1317.3887,183.5195" fill="#D1F2EB" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="277.748" x="1007.3267" y="200.5864">Use when: alternation / character classes /</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="303.145" x="1007.3267" y="215.7192">wildcards are needed, or you want the pattern</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="305.062" x="1007.3267" y="230.8521">compiled once into an NFA-backed transducer.</text><rect fill="#D6EAF8" height="61.9063" rx="12.5" ry="12.5" style="stroke:#34495E;stroke-width:0.5;" width="265.5078" x="715.8188" y="180.2656"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="12" font-weight="700" lengthAdjust="spacing" textLength="90.5625" x="725.8188" y="201.4043">PhoneticWfst</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="12" lengthAdjust="spacing" textLength="37.207" x="816.3813" y="201.4043">&lt;D&gt; /</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="12" font-weight="700" lengthAdjust="spacing" textLength="113.9238" x="857.4028" y="201.4043">PhoneticNfaWfst</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="12" lengthAdjust="spacing" textLength="191.2969" x="725.8188" y="215.373">Thompson NFA over "(ph|f)one"</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="12" lengthAdjust="spacing" textLength="158.3379" x="725.8188" y="229.3418">feature = "phonetic-rules"</text><ellipse cx="848.5728" cy="281.7969" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="848.5728" cy="281.7969" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><line style="stroke:#34495E;stroke-width:1;" x1="521.3464" x2="521.3464" y1="72.2969" y2="92.2969"/><polygon fill="#34495E" points="517.3464,82.2969,521.3464,92.2969,525.3464,82.2969,521.3464,86.2969" style="stroke:#34495E;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#34495E;stroke-width:1;" x1="194.1201" x2="194.1201" y1="246.4844" y2="279.4219"/><polygon fill="#34495E" points="190.1201,269.4219,194.1201,279.4219,198.1201,269.4219,194.1201,273.4219" style="stroke:#34495E;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#34495E;stroke-width:1;" x1="848.5728" x2="848.5728" y1="242.1719" y2="270.7969"/><polygon fill="#34495E" points="844.5728,260.7969,848.5728,270.7969,852.5728,260.7969,848.5728,264.7969" style="stroke:#34495E;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#34495E;stroke-width:1;" x1="391.7463" x2="194.1201" y1="158.2656" y2="158.2656"/><line style="stroke:#34495E;stroke-width:1;" x1="194.1201" x2="194.1201" y1="158.2656" y2="184.5781"/><polygon fill="#34495E" points="190.1201,174.5781,194.1201,184.5781,198.1201,174.5781,194.1201,178.5781" style="stroke:#34495E;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#34495E;stroke-width:1;" x1="650.9465" x2="848.5728" y1="158.2656" y2="158.2656"/><line style="stroke:#34495E;stroke-width:1;" x1="848.5728" x2="848.5728" y1="158.2656" y2="180.2656"/><polygon fill="#34495E" points="844.5728,170.2656,848.5728,180.2656,852.5728,170.2656,848.5728,174.2656" style="stroke:#34495E;stroke-width:1;stroke-linejoin:miter;stroke-miterli