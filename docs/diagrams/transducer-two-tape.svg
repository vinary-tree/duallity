<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="STATE" height="288px" preserveAspectRatio="none" style="width:1400px;height:288px;background:#FFFFFF;" version="1.1" viewBox="0 0 1400 288" width="1400px" zoomAndPan="magnify"><?plantuml $version$?><defs/><g><g class="title" data-source-line="13"><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="460.9473" x="466.0622" y="22.9951">D2 &#183; The Levenshtein automaton as a two-tape transducer</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="621.3457" x="385.863" y="39.292">input tape = query (misspelled)   &#183;   output tape = dictionary term (correction)</text></g><g class="entity" data-qualified-name="S" data-source-line="15" id="ent0001"><rect fill="#FDEBD0" height="50" rx="12.5" ry="12.5" style="stroke:#34495E;stroke-width:0.5;" width="209.4033" x="477.62" y="60.5938"/><line style="stroke:#34495E;stroke-width:0.5;" x1="477.62" x2="687.0233" y1="86.8906" y2="86.8906"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="189.4033" x="487.62" y="78.5889">S = (dict_node, query_pos)</text></g><g class="entity" data-qualified-name="MS" data-source-line="16" id="ent0002"><rect fill="#D1F2EB" height="52.5938" rx="12.5" ry="12.5" style="stroke:#34495E;stroke-width:0.5;" width="221.1611" x="51.74" y="204.1238"/><line style="stroke:#34495E;stroke-width:0.5;" x1="51.74" x2="272.9011" y1="246.7175" y2="246.7175"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="95.7783" x="61.74" y="222.1189">advance both</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="201.1611" x="61.74" y="238.4157">(dict_node+1, query_pos+1)</text></g><g class="entity" data-qualified-name="INS" data-source-line="17" id="ent0003"><rect fill="#D1F2EB" height="52.5938" rx="12.5" ry="12.5" style="stroke:#34495E;stroke-width:0.5;" width="200.5234" x="482.05" y="204.1238"/><line style="stroke:#34495E;stroke-width:0.5;" x1="482.05" x2="682.5734" y1="246.7175" y2="246.7175"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="123.9902" x="492.05" y="222.1189">advance dict only</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="180.5234" x="492.05" y="238.4157">(dict_node+1, query_pos)</text></g><g class="entity" data-qualified-name="DEL" data-source-line="18" id="ent0004"><rect fill="#D1F2EB" height="52.5938" rx="12.5" ry="12.5" style="stroke:#34495E;stroke-width:0.5;" width="200.5234" x="754.05" y="204.1238"/><line style="stroke:#34495E;stroke-width:0.5;" x1="754.05" x2="954.5734" y1="246.7175" y2="246.7175"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="138.4414" x="764.05" y="222.1189">advance query only</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="180.5234" x="764.05" y="238.4157">(dict_node, query_pos+1)</text></g><g class="entity" data-qualified-name="GMN9" data-source-line="26" id="ent0010"><path d="M989.56,187.5938 L989.56,273.2578 L1385.0717,273.2578 L1385.0717,197.5938 L1375.0717,187.5938 L989.56,187.5938" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1375.0717,187.5938 L1375.0717,197.5938 L1385.0717,197.5938 L1375.0717,187.5938" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="70.6748" x="995.56" y="204.6606">Each arc is</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="165.769" x="1074.4995" y="204.6606">input : output / weight</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="1240.2685" y="204.6606">.</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="251.4624" x="995.56" y="219.7935">&#8226; input  = query-side label  (None = &#949;)</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="247.4824" x="995.56" y="234.9263">&#8226; output = dict-side  label  (None = &#949;)</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="374.5117" x="995.56" y="250.0591">&#8226; weight = TropicalWeight (0 = free match, 1 = one edit)</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="316.5386" x="995.56" y="265.1919">A path's total weight (&#8855; = +) is its edit distance.</text></g><!--link S to MS--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" data-link-type="dependency" data-source-line="20" id="lnk5"><path d="M477.17,89.3937 C325.14,94.5437 58.77,108.1238 29.32,140.5938 C6,166.2938 32.5329,186.1891 70.5329,201.7491" fill="none" id="S-to-MS" style="stroke:#2ECC71;stroke-width:1;"/><polygon fill="#2ECC71" points="75.16,203.6437,68.3469,196.5316,70.5329,201.7491,65.3154,203.935,75.16,203.6437" style="stroke:#2ECC71;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="45.4937" x="30.32" y="153.6606">match</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="59.2871" x="88.2106" y="153.6606">q[i]:w[j] /</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="9.0454" x="151.6301" y="153.6606">0</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" tex