<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="452px" preserveAspectRatio="none" style="width:571px;height:452px;background:#FFFFFF;" version="1.1" viewBox="0 0 571 452" width="571px" zoomAndPan="magnify"><?plantuml $version$?><defs/><g><g class="title" data-source-line="11"><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="529.1221" x="17.5306" y="22.9951">D17 &#183; The tropical (min, +) semiring  &#120130; = (&#8477; &#8746; {+&#8734;}, min, +, +&#8734;, 0)</text></g><!--entity PLUS--><g class="entity" data-qualified-name="PLUS" data-source-line="13" id="ent0001"><rect fill="#FCF3CF" height="101.4844" rx="2.5" ry="2.5" style="stroke:#34495E;stroke-width:0.5;" width="162.1055" x="19.97" y="44.2969"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="72.3105" x="29.97" y="67.292">&#8853;  =  min</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="137.1289" x="29.97" y="83.5889">the best (cheapest)</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="112.0137" x="29.97" y="99.8857">alternative wins</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="4.4502" x="29.97" y="116.1826">&#160;</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="142.1055" x="29.97" y="132.4795">example:  2 &#8853; 5 = 2</text></g><!--entity TIMES--><g class="entity" data-qualified-name="TIMES" data-source-line="14" id="ent0002"><rect fill="#FCF3CF" height="101.4844" rx="2.5" ry="2.5" style="stroke:#34495E;stroke-width:0.5;" width="162.1055" x="219.97" y="44.2969"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="54.6875" x="229.97" y="67.292">&#8855;  =  +</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="89.3525" x="229.97" y="83.5889">costs add up</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="88.1016" x="229.97" y="99.8857">along a path</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="4.4502" x="229.97" y="116.1826">&#160;</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="142.1055" x="229.97" y="132.4795">example:  2 &#8855; 5 = 7</text></g><!--entity ZERO--><g class="entity" data-qualified-name="ZERO" data-source-line="15" id="ent0003"><rect fill="#F2F3F4" height="101.4844" rx="2.5" ry="2.5" style="stroke:#34495E;stroke-width:0.5;" width="176.0508" x="7" y="205.7769"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="64.3604" x="17" y="228.772">0&#772;  =  +&#8734;</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="93.2969" x="17" y="245.0689">identity for &#8853;</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="145.5439" x="17" y="261.3657">(no path / forbidden)</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="4.4502" x="17" y="277.6626">&#160;</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="156.0508" x="17" y="293.9595">TropicalWeight::zero()</text></g><!--entity ONE--><g class="entity" data-qualified-name="ONE" data-source-line="16" id="ent0004"><rect fill="#F9E79F" height="101.4844" rx="2.5" ry="2.5" style="stroke:#34495E;stroke-width:0.5;" width="171.8193" x="218.12" y="205.7769"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="50.709" x="228.12" y="228.772">1&#772;  =  0</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="93.2969" x="228.12" y="245.0689">identity for &#8855;</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="86.5977" x="228.12" y="261.3657">(a free step)</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="4.4502" x="228.12" y="277.6626">&#160;</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="151.8193" x="228.12" y="293.9595">TropicalWeight::one()</text></g><g class="entity" data-qualified-name="GMN9" data-source-line="24" id="ent0010"><path d="M51.86,367.2669 L51.86,437.7981 A0,0 0 0 0 51.86,437.7981 L556.1832,437.7981 A0,0 0 0 0 556.1832,437.7981 L556.1832,377.2669 L546.1832,367.2669 L308.03,367.2669 L304.03,307.4869 L300.03,367.2669 L51.86,367.2669 A0,0 0 0 0 51.86,367.2669" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M546.1832,367.2669 L546.1832,377.2669 L556.1832,377.2669 L546.1832,367.2669" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="331.0938" x="57.86" y="384.3338">Under (min, +):  "&#8853;-sum over all paths" becomes "</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="142.1177" x="388.9538" y="384.3338">minimum-cost path</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="10.1118" x="531.0714" y="384.3338">",</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="265.3892" x="57.86" y="399.4666">and "&#8855;-product along a path" becomes "</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="133.2754" x="323.2492" y="399.4666">sum of edge costs</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="10.1118" x="456.5246" y="399.4666">".</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="119.3994" x="57.86" y="414.5994">So a shortest path</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="12.1938" x="181.3917" y="414.5994">is</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="127.6895" x="197.7179" y="414.5994">the best correction.</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="129.5112" x="57.86" y="429.7322">&#9888; Note the naming:</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="43.6084" x="191.5036" y="429.7322">zero()</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="75.4927" x="239.2443" y="429.7322">is the value</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="21.7217" x="318.8693" y="429.7322">+&#8734;</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="24.4575" x="344.7233" y="429.7322">and</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="38.8857" x="373.3131" y="429.7322">one()</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="75.4927" x="416.3312" y="429.7322">is the value</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="9.0454" x="495.9562" y="429.7322">0</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="505.0016" y="429.7322">.</text></g><!--link PLUS to TIMES--><!--link ZERO to ONE--><!--link PLUS to ZERO--><!--link TIMES to ONE--><?plantuml-src TPJFRjD04CRlVefHE3HHaxJqZwf6fGVQM4A25j4M90Y7YJsnbzgxPdVTKgfA2FLGSQQAX5J4cHVWpfcdo1Fm2CokqpIaRPH3xFrcVhFVp6GEjX-kmUZJLzZNgX0HPc0e5rh8131BgAyH2fIKjOCvs2PMMDC1cnBKSo6RCD-OoE8IiqpO4uXKNfIM33Y1i0RiiG8HaxJ22Z9DG1dx596IXjwN92FYPxICG32fqXni6MjJ4COh--u5IdDCkXsOGo4Br9X37wF3HAjInbigKneUXFupfJ0fnkhOtMQ0cQ6favW6M6OsLDBkO4vGswPt-BA4FSRKfdIQ8eiooGXE0u37IiUanxJbbPNrrIw_lIV9MS0tva1dyUzViCyNiTSkJ-oRs0r_hou_moEeZywlO7Jn4qxdHnVVpvfGAVdBZqrOR0J1JKsrZVxcwCibS9pJRIpqDtjoubWzIWaB_jNeISmiQObM716m8QOdUv8-O5var05O0fTbbTCirG0DF7zwiCTsReNBM-4jtD3ZvYjOf0ot6ECOoi9Hb9iStxpRXA4dh7d2_fDdtViGYt_EAmJVkAACn-S41cmybzgJTQcg4Lbmx_eYPaN38Qy7-HM99BMTpaVIgjxmpDVT5xkCN0gNmvKPvCCnSl5Etf1v20DD1CPISIT7IHfZTdUwJ5dlhgs7GU2TRBr9VO5ljTEsgii7lfpP8mwUYU41bYrVUr2PDdFY8WAfB3TTMQjo7iW3oLCwcJ5slyQUjKoPWphY0rvKxvsfyPpmklAkEWzOBl8oRxcM-dFdHQt9-Tp6SefXgz0gBYFUnQa-_v_4GmP0SU8Md6V39sbpaZrrQxrPBxpWPiiZfLrdX98kPlJj1-ougxbpYLnXqd5HLLDzvFWluWYpajpHzT3ueldPz-LEfUzrEo3MEVl-0G00?></g></svg>